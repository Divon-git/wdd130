<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact us today to book your white water rafting adventure, ask questions about our guided river trips, or get expert help planning your group excursion.">
    <meta name="author" content="Divine Kalu">
    <link rel="Stylesheet" href="styles/rafting.css">
    <title>Contact us The Rapids</title>
</head>

<body>

    <header>

        <img src="images/z-therapidssplash.jpg" width="200"
          alt="The Rapids white water rafting company logo featuring a blue wave and red swoosh">
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="trips.html">Trips</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>

    </header>

    <main>

        <div class="address">
            <h1>The Rapids Rafting Company</h1>
            <p>123 Main River Street</p>
            <p>Kolob, California</p>
            <p>+1 999 999 9999</p>
        </div>
        <div class="form-map-container">
            <div class="map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d124444.05176851382!2d3.3382459168461818!3d6.557546076606882!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2sng!4v1785534543505!5m2!1sen!2sng"
                  width="350" height="450" allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

            <form>
                <label for="username">Name</label>
                <input type="text" name="username" id="username" placeholder="Your name" required>
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Your email address"
                  required>
                <label>Message<br>Purpose</label>
                <div class="radio-group">
                    <label for="purpose1">
                        <input type="radio" name="Purpose1" id="purpose1">
                        General Inquiry
                    </label>
                    <label for="purpose2">
                        <input type="radio" name="Purpose2" id="purpose2">
                        Reservation question
                    </label>
                    <label for="purpose3">
                        <input type="radio" name="Purpose3" id="purpose3">
                        Website Suggestion
                    </label>
                </div>
                <label for="message">Message</label>
                <textarea name="message" id="message" placeholder="Type here" rows="5"
                  required></textarea>
                <div class="newsletter">
                    <input type="checkbox" name="newsletter" id="newsletter">
                    <label for="news">
                        Please subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit" class="row2">Get in touch!!</button>
            </form>
        </div>

        <section id="employee-section">
            <h2>We Are Here to Serve You</h2>
            <div class="employee-content">
                <figure>
                    <img src="images/mypicture.jpg" alt="Divine Kalu professional headshot">
                    <figcaption>
                        <strong>Divine kalu</strong><br>
                        Software engineer
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/randompersoni.jpg"
                      alt="A close-up headshot of a smiling man with wavy dark brown hair and brown eyes">
                    <figcaption>
                        <strong>John doe</strong><br>
                        Safety Director
                    </figcaption>
                </figure>
                <figure>
                    <img src="images/randompersonii.jpeg" alt="Trip coordinator">
                    <figcaption>
                        <strong>Jane doe</strong><br>
                        Trip Coordinator
                    </figcaption>
                </figure>
            </div>
        </section>

    </main>

    <footer>
        <p>&copy; 2026 The Rapids | Divine kalu</p>
        <nav class="socialmedia">
            <a href="facebook.com"><img src="images/facebookicon.png"
                  alt="facebook social media icon"></a>
            <a href="instagram.com"><img src="images/instagramicon.png"
                  alt="instagram social media icon"></a>
            <a href="twitterx.com"><img src="images/xicon.png"
                  alt="twitter x social media icon"></a>
        </nav>
    </footer>


</body>

</html>
