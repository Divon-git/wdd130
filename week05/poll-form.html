<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles/poll-form.css ">
</head>

<body>
    <header>

    </header>
    <main>

    </main>
    <footer>
        <form>
            <fieldset>
                <legend>Contact Information</legend>
                <div class="form-item column2">
                    <label for="fullname">Full name:</label>
                    <input type="text" id="fullname" name="fullname" required>
                </div>
                <div class="form-item column2">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="useremail" required>
                </div>
            </fieldset>
            <fieldset>
                <legend>Questions</legend>
                <div class="form-item column2 column1">
                    <label for="quantity">What is your Favourite browser</label>
                    <select name="quantity" id="quantity">
                        <option value="1">chrome</option>
                        <option value="2">safari</option>
                        <option value="3">opera</option>
                    </select>
                </div>

                <div class="form-item column2 column1">
                    <label>Do you have a household pet?<input type="checkbox" id="pet" name="pet">
                    </label>
                </div>
                <div class="form-item column2">
                    <label for="places">List the places you have lived.</label>
                    <textarea id="feedback" name="feedback" rows="5"
                      placeholder="Florida, kentuky, lagos, new york"></textarea>
                </div>
            </fieldset>

            <button type="submit">Submit poll</button>
        </form>
    </footer>
</body>

</html>
