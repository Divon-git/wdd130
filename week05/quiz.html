<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quize</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>

<body>
    <h1>Form Quiz</h1>

    <form>
        <label for="q1">1. What does the acronym Css stand for</label>
        <input type="text" id="q1" name="q1" required>

        <label for="q2">2. How are id and class attribute selected in Css?</label>
        <textarea id="q2" name="q2" required rows="4"></textarea>

        <label for="q3">3. Which of the following is a valid css comment? </label>
        <select id="q3" name="q3" required>
            <option value="" selected disabled>Chose one</option>
            <option value="one">/* This is a single-line comment */</option>
            <option value="two">.. This is a single-line comment...</option>
            <option value="three">(coment)This is a single-line comment(coment)</option>
        </select>
        <label for="q4">4. How many h1 element should be on a page?</label>
        <input type="number" id="q4" name="q4" required>
        <button>Submit quiz</button>
    </form>


</body>

</html>
